{% extends 'admin/base.html' %}

{% block title %}Edit Vehicle - Admin{% endblock %}

{% block admin_content %}
<div class="mb-4">
    <h2><i class="fas fa-edit"></i> Edit Vehicle</h2>
    <p class="text-muted">Update vehicle information</p>
</div>

<div class="card shadow-sm">
    <div class="card-body">
        <form method="POST" enctype="multipart/form-data" id="vehicleForm">
            <div class="row">
                <!-- Current Image -->
                {% if vehicle.image_url %}
                <div class="col-md-12 mb-4">
                    <label class="form-label">Current Image</label>
                    <div>
                        <img src="{{ url_for('static', filename='images/uploads/' + vehicle.image_url) }}" 
                             alt="{{ vehicle.make }} {{ vehicle.model }}"
                             class="image-preview">
                    </div>
                </div>
                {% endif %}

                <!-- New Vehicle Image -->
                <div class="col-md-12 mb-4">
                    <label for="image" class="form-label">Upload New Image (optional)</label>
                    <input type="file" class="form-control" id="image" name="image" accept="image/*">
                    <div id="imagePreview" class="mt-3"></div>
                </div>

                <!-- Make -->
                <div class="col-md-6 mb-3">
                    <label for="make" class="form-label">Make <span class="text-danger">*</span></label>
                    <input type="text" class="form-control" id="make" name="make" required value="{{ vehicle.make }}">
                </div>

                <!-- Model -->
                <div class="col-md-6 mb-3">
                    <label for="model" class="form-label">Model <span class="text-danger">*</span></label>
                    <input type="text" class="form-control" id="model" name="model" required value="{{ vehicle.model }}">
                </div>

                <!-- Year -->
                <div class="col-md-4 mb-3">
                    <label for="year" class="form-label">Year <span class="text-danger">*</span></label>
                    <input type="number" class="form-control" id="year" name="year" required min="1990" max="2026" value="{{ vehicle.year }}">
                </div>

                <!-- Price -->
                <div class="col-md-4 mb-3">
                    <label for="price" class="form-label">Price ($) <span class="text-danger">*</span></label>
                    <input type="number" class="form-control" id="price" name="price" required min="0" step="1000" value="{{ vehicle.price }}">
                </div>

                <!-- Mileage -->
                <div class="col-md-4 mb-3">
                    <label for="mileage" class="form-label">Mileage (km) <span class="text-danger">*</span></label>
                    <input type="number" class="form-control" id="mileage" name="mileage" required min="0" value="{{ vehicle.mileage }}">
                </div>

                <!-- VIN -->
                <div class="col-md-6 mb-3">
                    <label for="vin" class="form-label">VIN <span class="text-danger">*</span></label>
                    <input type="text" class="form-control" id="vin" name="vin" required maxlength="17" value="{{ vehicle.vin }}">
                    <small class="text-muted">Vehicle Identification Number (17 characters)</small>
                </div>

                <!-- Condition -->
                <div class="col-md-6 mb-3">
                    <label for="condition" class="form-label">Condition <span class="text-danger">*</span></label>
                    <select class="form-select" id="condition" name="condition" required>
                        <option value="excellent" {% if vehicle.condition == 'excellent' %}selected{% endif %}>Excellent</option>
                        <option value="good" {% if vehicle.condition == 'good' %}selected{% endif %}>Good</option>
                        <option value="fair" {% if vehicle.condition == 'fair' %}selected{% endif %}>Fair</option>
                    </select>
                </div>

                <!-- Fuel Type -->
                <div class="col-md-4 mb-3">
                    <label for="fuel_type" class="form-label">Fuel Type <span class="text-danger">*</span></label>
                    <select class="form-select" id="fuel_type" name="fuel_type" required>
                        <option value="gasoline" {% if vehicle.fuel_type == 'gasoline' %}selected{% endif %}>Gasoline</option>
                        <option value="diesel" {% if vehicle.fuel_type == 'diesel' %}selected{% endif %}>Diesel</option>
                        <option value="electric" {% if vehicle.fuel_type == 'electric' %}selected{% endif %}>Electric</option>
                        <option value="hybrid" {% if vehicle.fuel_type == 'hybrid' %}selected{% endif %}>Hybrid</option>
                    </select>
                </div>

                <!-- Transmission -->
                <div class="col-md-4 mb-3">
                    <label for="transmission" class="form-label">Transmission <span class="text-danger">*</span></label>
                    <select class="form-select" id="transmission" name="transmission" required>
                        <option value="automatic" {% if vehicle.transmission == 'automatic' %}selected{% endif %}>Automatic</option>
                        <option value="manual" {% if vehicle.transmission == 'manual' %}selected{% endif %}>Manual</option>
                    </select>
                </div>

                <!-- Body Type -->
                <div class="col-md-4 mb-3">
                    <label for="body_type" class="form-label">Body Type <span class="text-danger">*</span></label>
                    <select class="form-select" id="body_type" name="body_type" required>
                        <option value="sedan" {% if vehicle.body_type == 'sedan' %}selected{% endif %}>Sedan</option>
                        <option value="suv" {% if vehicle.body_type == 'suv' %}selected{% endif %}>SUV</option>
                        <option value="truck" {% if vehicle.body_type == 'truck' %}selected{% endif %}>Truck</option>
                        <option value="van" {% if vehicle.body_type == 'van' %}selected{% endif %}>Van</option>
                        <option value="coupe" {% if vehicle.body_type == 'coupe' %}selected{% endif %}>Coupe</option>
                        <option value="hatchback" {% if vehicle.body_type == 'hatchback' %}selected{% endif %}>Hatchback</option>
                        <option value="wagon" {% if vehicle.body_type == 'wagon' %}selected{% endif %}>Wagon</option>
                    </select>
                </div>

                <!-- Status -->
                <div class="col-md-6 mb-3">
                    <label for="status" class="form-label">Status <span class="text-danger">*</span></label>
                    <select class="form-select" id="status" name="status" required>
                        <option value="available" {% if vehicle.status == 'available' %}selected{% endif %}>Available</option>
                        <option value="reserved" {% if vehicle.status == 'reserved' %}selected{% endif %}>Reserved</option>
                        <option value="sold" {% if vehicle.status == 'sold' %}selected{% endif %}>Sold</option>
                    </select>
                </div>

                <!-- Featured -->
                <div class="col-md-6 mb-3">
                    <label class="form-label d-block">Featured</label>
                    <div class="form-check">
                        <input class="form-check-input" type="checkbox" id="featured" name="featured" {% if vehicle.featured %}checked{% endif %}>
                        <label class="form-check-label" for="featured">
                            Display on homepage
                        </label>
                    </div>
                </div>

                <!-- Description -->
                <div class="col-md-12 mb-3">
                    <label for="description" class="form-label">Description</label>
                    <textarea class="form-control" id="description" name="description" rows="4">{{ vehicle.description }}</textarea>
                </div>
            </div>

            <div class="d-flex gap-2">
                <button type="submit" class="btn btn-primary">
                    <i class="fas fa-save"></i> Update Vehicle
                </button>
                <a href="{{ url_for('admin_vehicles') }}" class="btn btn-secondary">
                    <i class="fas fa-times"></i> Cancel
                </a>
            </div>
        </form>
    </div>
</div>
{% endblock %}

{% block extra_js %}
<script src="{{ url_for('static', filename='js/admin.js') }}"></script>
{% endblock %}
