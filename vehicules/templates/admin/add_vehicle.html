{% extends 'admin/base.html' %}

{% block title %}Add Vehicle - Admin{% endblock %}

{% block admin_content %}
<div class="mb-4">
    <h2><i class="fas fa-plus"></i> Add New Vehicle</h2>
    <p class="text-muted">Fill in the details below to add a new vehicle to your inventory</p>
</div>

<div class="card shadow-sm">
    <div class="card-body">
        <form method="POST" enctype="multipart/form-data" id="vehicleForm">
            <div class="row">
                <!-- Vehicle Image -->
                <div class="col-md-12 mb-4">
                    <label for="image" class="form-label">Vehicle Image</label>
                    <input type="file" class="form-control" id="image" name="image" accept="image/*">
                    <div id="imagePreview" class="mt-3"></div>
                </div>

                <!-- Make -->
                <div class="col-md-6 mb-3">
                    <label for="make" class="form-label">Make <span class="text-danger">*</span></label>
                    <input type="text" class="form-control" id="make" name="make" required placeholder="e.g., Toyota, Honda, BMW">
                </div>

                <!-- Model -->
                <div class="col-md-6 mb-3">
                    <label for="model" class="form-label">Model <span class="text-danger">*</span></label>
                    <input type="text" class="form-control" id="model" name="model" required placeholder="e.g., Camry, Accord, X5">
                </div>

                <!-- Year -->
                <div class="col-md-4 mb-3">
                    <label for="year" class="form-label">Year <span class="text-danger">*</span></label>
                    <input type="number" class="form-control" id="year" name="year" required min="1990" max="2026" placeholder="2024">
                </div>

                <!-- Price -->
                <div class="col-md-4 mb-3">
                    <label for="price" class="form-label">Price ($) <span class="text-danger">*</span></label>
                    <input type="number" class="form-control" id="price" name="price" required min="0" step="1000" placeholder="5000000">
                </div>

                <!-- Mileage -->
                <div class="col-md-4 mb-3">
                    <label for="mileage" class="form-label">Mileage (km) <span class="text-danger">*</span></label>
                    <input type="number" class="form-control" id="mileage" name="mileage" required min="0" placeholder="50000">
                </div>

                <!-- VIN -->
                <div class="col-md-6 mb-3">
                    <label for="vin" class="form-label">VIN <span class="text-danger">*</span></label>
                    <input type="text" class="form-control" id="vin" name="vin" required maxlength="17" placeholder="1HGBH41JXMN109186">
                    <small class="text-muted">Vehicle Identification Number (17 characters)</small>
                </div>

                <!-- Condition -->
                <div class="col-md-6 mb-3">
                    <label for="condition" class="form-label">Condition <span class="text-danger">*</span></label>
                    <select class="form-select" id="condition" name="condition" required>
                        <option value="">Select condition</option>
                        <option value="excellent">Excellent</option>
                        <option value="good">Good</option>
                        <option value="fair">Fair</option>
                    </select>
                </div>

                <!-- Fuel Type -->
                <div class="col-md-4 mb-3">
                    <label for="fuel_type" class="form-label">Fuel Type <span class="text-danger">*</span></label>
                    <select class="form-select" id="fuel_type" name="fuel_type" required>
                        <option value="">Select fuel type</option>
                        <option value="gasoline">Gasoline</option>
                        <option value="diesel">Diesel</option>
                        <option value="electric">Electric</option>
                        <option value="hybrid">Hybrid</option>
                    </select>
                </div>

                <!-- Transmission -->
                <div class="col-md-4 mb-3">
                    <label for="transmission" class="form-label">Transmission <span class="text-danger">*</span></label>
                    <select class="form-select" id="transmission" name="transmission" required>
                        <option value="">Select transmission</option>
                        <option value="automatic">Automatic</option>
                        <option value="manual">Manual</option>
                    </select>
                </div>

                <!-- Body Type -->
                <div class="col-md-4 mb-3">
                    <label for="body_type" class="form-label">Body Type <span class="text-danger">*</span></label>
                    <select class="form-select" id="body_type" name="body_type" required>
                        <option value="">Select body type</option>
                        <option value="sedan">Sedan</option>
                        <option value="suv">SUV</option>
                        <option value="truck">Truck</option>
                        <option value="van">Van</option>
                        <option value="coupe">Coupe</option>
                        <option value="hatchback">Hatchback</option>
                        <option value="wagon">Wagon</option>
                    </select>
                </div>

                <!-- Status -->
                <div class="col-md-6 mb-3">
                    <label for="status" class="form-label">Status <span class="text-danger">*</span></label>
                    <select class="form-select" id="status" name="status" required>
                        <option value="available">Available</option>
                        <option value="reserved">Reserved</option>
                        <option value="sold">Sold</option>
                    </select>
                </div>

                <!-- Featured -->
                <div class="col-md-6 mb-3">
                    <label class="form-label d-block">Featured</label>
                    <div class="form-check">
                        <input class="form-check-input" type="checkbox" id="featured" name="featured">
                        <label class="form-check-label" for="featured">
                            Display on homepage
                        </label>
                    </div>
                </div>

                <!-- Description -->
                <div class="col-md-12 mb-3">
                    <label for="description" class="form-label">Description</label>
                    <textarea class="form-control" id="description" name="description" rows="4" placeholder="Enter vehicle description, features, and additional information..."></textarea>
                </div>
            </div>

            <div class="d-flex gap-2">
                <button type="submit" class="btn btn-primary">
                    <i class="fas fa-save"></i> Add Vehicle
                </button>
                <a href="{{ url_for('admin_vehicles') }}" class="btn btn-secondary">
                    <i class="fas fa-times"></i> Cancel
                </a>
            </div>
        </form>
    </div>
</div>
{% endblock %}

{% block extra_js %}
<script src="{{ url_for('static', filename='js/admin.js') }}"></script>
{% endblock %}
